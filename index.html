<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMC 交易訓練場</title>
<style>
:root{
  --bg:#0d1117;--panel:#151b23;--panel2:#1b2330;--line:#263040;--txt:#d6dee8;--mut:#8493a5;
  --up:#26a69a;--dn:#ef5350;--blue:#42a5f5;--amber:#ffb74d;--accent:#4f8cff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px}
nav{display:flex;gap:4px;margin-left:auto}
button,select,input{font:inherit;color:inherit}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:5px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--panel2);color:var(--txt);border-color:var(--line)}
main{padding:10px 14px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 16px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
label.f input,label.f select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--txt)}
label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:12px}
.mut{color:var(--mut)}.up{color:var(--up)}.dn{color:var(--dn)}
.layout{display:grid;grid-template-columns:1fr 330px;gap:10px}
.chartwrap{position:relative;height:calc(100vh - 170px);min-height:380px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none}

.zoom{position:absolute;right:72px;top:4px;display:flex;gap:4px}.zoom .btn{padding:2px 10px;font-size:14px}
#ohlc{position:absolute;left:8px;top:6px;font-size:12px;color:var(--mut);pointer-events:none;text-shadow:0 0 4px var(--bg)}
#topinfo{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-bottom:8px;font-size:13px}
#topinfo b{font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acts button{padding:14px 4px;border-radius:10px;border:0;font-size:15px;font-weight:700;cursor:pointer;color:#fff}
.acts button small{display:block;font-weight:400;font-size:11px;opacity:.8}
#bBuy{background:#1f8f84}#bSell{background:#c8433f}#bWait{background:#46566b}
.acts button:hover{filter:brightness(1.15)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.tag.g{color:var(--up);border-color:#1f6b63}.tag.r{color:var(--dn);border-color:#7a3331}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
tr.click{cursor:pointer}tr.click:hover,tr.sel{background:var(--panel2)}tr.sel td:first-child{box-shadow:inset 3px 0 0 #ffd54f}
.dots{letter-spacing:2px}
.logbox{max-height:130px;overflow:auto;font-size:12px;color:var(--mut)}
.logbox div{padding:1px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 16px;border-radius:8px;z-index:20;display:none}
#loading{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30;font-size:16px}
.warn{background:#3a2a10;border:1px solid #7a5a1f;color:#ffcc80;padding:6px 10px;border-radius:8px;margin-bottom:8px;font-size:12.5px}
.rv{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px}
.rv input[type=range]{flex:1;min-width:200px}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:8px 10px}
.stat .l{font-size:11px;color:var(--mut)}.stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .chartwrap{height:52vh;min-height:320px}
}
</style>
</head>
<body>
<header>
  <h1>SMC 交易訓練場</h1>
  <span class="mut" style="font-size:12px">5 分 K · Smart Money Concepts</span>
  <nav>
    <button data-tab="play" class="on">訓練</button>
    <button data-tab="stats">統計</button>
  </nav>
</header>
<main>

<section id="tab-play">
  <!-- 設定 -->
  <div id="setup">
    <div class="card">
      <h3>資料來源</h3>
      <div class="grid2">
        <label class="f">來源
          <select id="cSource">
            <option value="binance">Binance 歷史 5 分 K（隨機時段）</option>
            <option value="csv">匯入 CSV</option>
            <option value="synth">模擬資料（離線測試）</option>
          </select>
        </label>
        <label class="f" id="wrapSym">幣種
          <select id="cSym"><option value="RANDOM">隨機</option></select>
        </label>
        <label class="f" id="wrapCsv" hidden>CSV 檔（時間,開,高,低,收,量）
          <input type="file" id="cCsv" accept=".csv,.txt">
        </label>
        <label class="f">起始已知 K 棒數（背景）<input type="number" id="cHist" min="50" max="400" step="10"></label>
        <label class="f">訓練 K 棒數（最多 900）<input type="number" id="cPlay" min="50" max="900" step="50"></label>
      </div>
    </div>
    <div class="card">
      <h3>交易規則</h3>
      <div class="grid2">
        <label class="f">每單位名目金額（USDT，初始資金 10,000）<input type="number" id="cUnit" min="100" step="100"></label>
        <label class="f">最多持有單位（含加碼）<input type="number" id="cMaxU" min="1" max="20"></label>
        <label class="f">手續費（單邊 %）<input type="number" id="cFee" min="0" step="0.01"></label>
        <label class="f">訓練模式
          <select id="cMode"><option value="sop">3+1 課程 SOP（停損＝第二個 OB 外側）</option><option value="free">自由模式</option></select>
        </label>
        <label class="f">停利風報比 R（課程：1 或 1.5；0 = 不設）<input type="number" id="cRR" min="0" step="0.5"></label>
        <label class="f">回踩確認最早在第幾根（第 1 根＝首次碰到 OB1 的 K 棒）
          <select id="cConf"><option value="3">第 3 根（課程標準）</option><option value="2">第 2 根起</option><option value="1">第 1 根起</option></select>
        </label>
        <label class="chk" style="align-self:end"><input type="checkbox" id="cOb2"> 必須找到兩個 OB 才算標準進場（停損放第 2 個）</label>
        <label class="chk" style="align-self:end"><input type="checkbox" id="cFvg"> 沒有 OB 時，改用 FVG 當回踩區（停損放 FVG 之外）</label>
        <label class="chk" style="align-self:end"><input type="checkbox" id="cEng"> 額外要求大實體並突破前一根高點／低點（舊版吞噬條件）</label>
        <label class="f" id="wrapSlMode">自動停損停利（自由模式）
          <select id="cSlMode"><option value="off">關閉（全由我決定）</option><option value="atr">開啟（ATR 倍數）</option></select>
        </label>
        <label class="f">ATR 停損倍數（自由模式；SOP 找不到 OB 時的備用）<input type="number" id="cSlK" min="0.3" step="0.1"></label>
      </div>
      <p class="mut" style="margin:8px 0 0;font-size:12px">規則：成交在當前 K 棒收盤價。同方向再按＝加碼一單位；反方向＝全部平倉（再按一次才反手開單）。停損停利以後續 K 棒的高低點判定，同棒兩者皆觸及時以停損優先。SOP 模式下，開倉時自動把停損設在第二個同向 OB 外側（沒有第二個就用第一個），停利依上面的 R 設定。</p>
    </div>
    <div class="card">
      <label class="chk"><input type="checkbox" id="cBlind"> 盲測模式（訓練中隱藏幣種與日期，結束後揭曉）</label>
      <div style="margin-top:12px"><button class="btn primary" id="btnStart">開始訓練</button></div>
      <div id="setupMsg" class="mut" style="margin-top:8px;font-size:12px"></div>
    </div>
  </div>

  <!-- 遊戲 / 復盤 -->
  <div id="game" hidden>
    <div id="warn"></div>
    <div id="topinfo"></div>
    <div class="layout">
      <div>
        <div class="chartwrap"><canvas id="cv"></canvas><div id="ohlc"></div><div class="zoom"><button class="btn sm" data-zoom="0.8" aria-label="放大">＋</button><button class="btn sm" data-zoom="1.25" aria-label="縮小">－</button></div></div>
        <div id="reviewbar" class="card rv" hidden>
          <button class="btn sm" id="rvPrev">◀ 上一個進場點</button>
          <button class="btn sm primary" id="rvNext">下一個進場點 ▶</button>
          <span id="rvFocus" class="mut"></span>
          <span style="flex-basis:100%;height:0"></span>
          <button class="btn sm" data-step="-10">« 10</button>
          <button class="btn sm" data-step="-1">‹ 1</button>
          <input type="range" id="rvSlider">
          <button class="btn sm" data-step="1">1 ›</button>
          <button class="btn sm" data-step="10">10 »</button>
          <label class="chk"><input type="checkbox" id="rvFuture" checked> 顯示後續走勢</label>
          <label class="chk"><input type="checkbox" id="rvSig" checked> SOP 標準訊號與結果</label>
          <label class="chk"><input type="checkbox" id="rvWin" checked> 只看賺錢的進場點</label>
          <label class="chk"><input type="checkbox" id="rvBest"> 事後最佳多空段</label>
          <span id="rvTime" class="mut"></span>
        </div>
      </div>
      <aside>
        <div id="playPanel">
          <div class="card">
            <div class="acts">
              <button id="bBuy">買進</button>
              <button id="bWait">等待<small>W / 空白鍵</small></button>
              <button id="bSell">賣出</button>
            </div>
            <div class="mut" style="font-size:11px;margin-top:6px;text-align:center">快捷鍵：B / ↑ 買進　S / ↓ 賣出　W / 空白 / → 等待</div>
          </div>
          <div class="card"><h3>部位</h3><div id="posBox" class="kv"></div></div>
          <div class="card">
            <h3>圖層</h3>
            <div class="grid2" style="grid-template-columns:1fr 1fr;gap:4px 10px">
              <label class="chk"><input type="checkbox" data-layer="struct"> CH / BOS</label>
              <label class="chk"><input type="checkbox" data-layer="ob"> Order Block</label>
              <label class="chk"><input type="checkbox" data-layer="fvg"> FVG</label>
              <label class="chk"><input type="checkbox" data-layer="liq"> 流動性 / 掃蕩</label>
              <label class="chk"><input type="checkbox" data-layer="pd"> 溢價 / 折價</label>
              <label class="chk"><input type="checkbox" data-layer="swing"> 擺動高低點</label>
            </div>
            <label class="chk" style="margin-top:8px"><input type="checkbox" id="cHint"> 顯示 SOP 提示（連招狀態、OB1/OB2，練習初期用）</label>
            <div id="hintBox" style="margin-top:8px" hidden></div>
          </div>
          <div class="card">
            <button class="btn sm" id="btnEnd">結束並復盤</button>
            <button class="btn sm" id="btnQuit">放棄</button>
            <h3 style="margin-top:10px">紀錄</h3><div id="logBox" class="logbox"></div>
          </div>
        </div>
        <div id="sumPanel" hidden>
          <div class="card"><h3>本局結果</h3><div id="sumStats"></div></div>
          <div class="card"><h3>SOP 進場點 <span id="sigCount"></span>（點選跳到該處，鍵盤 N / P 切換）</h3><div style="overflow:auto"><table id="sigTable"></table></div></div>
          <div class="card"><h3>本局交易（點選可跳到進場處）</h3><div style="overflow:auto"><table id="sumTable"></table></div></div>
          <div class="card">
            <button class="btn primary" id="btnNext">再來一局</button>
            <button class="btn" id="btnBack">回設定</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
</section>

<section id="tab-stats" hidden>
  <div id="statsBody"></div>
</section>
</main>
<div id="toast"></div>
<div id="loading">載入資料中…</div>

<script>
"use strict";
/* ============================== 工具 ============================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sum=a=>a.reduce((x,y)=>x+y,0), mean=a=>a.length?sum(a)/a.length:0;
const pad2=n=>String(n).padStart(2,'0');
function fmtT(t){const d=new Date(t);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function fmtP(p){if(p==null||!isFinite(p))return '-';const a=Math.abs(p);return a>=1000?p.toFixed(1):a>=100?p.toFixed(2):a>=10?p.toFixed(3):a>=1?p.toFixed(4):p.toFixed(6)}
function fmtM(v,d=2){return (v>=0?'+':'')+v.toFixed(d)}
function cls(v){return v>0?'up':v<0?'dn':''}
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',1600)}
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ============================== 儲存 ============================== */
const KEY='smc_trainer_v1',CKEY='smc_trainer_cfg_v1';
const DB={
  load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.trades)return d}catch(e){}return{trades:[],sessions:[]}},
  save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
};
const SYMS=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','AVAXUSDT','LINKUSDT','LTCUSDT'];
const DEF={source:'binance',sym:'RANDOM',hist:150,play:500,view:90,unit:1000,maxU:5,fee:0.05,mode:'sop',slMode:'off',slK:1.5,rr:1,confirmFrom:2,needOb2:false,fvgZone:true,engulfExtra:false,ver:2,blind:true,hint:false,
  layers:{struct:true,ob:true,fvg:true,liq:false,pd:false,swing:false}};
let cfg=(()=>{
  try{
    const saved=JSON.parse(localStorage.getItem(CKEY))||{},c=Object.assign({},DEF,saved);
    if((saved.ver||0)<2){c.confirmFrom=2;c.needOb2=false;c.fvgZone=true;c.ver=2}   // 新預設：第 2 根起、一個 OB 即可、無 OB 時用 FVG
    return c;
  }catch(e){return{...DEF}}
})();
cfg.layers=Object.assign({},DEF.layers,cfg.layers||{});
function saveCfg(){try{localStorage.setItem(CKEY,JSON.stringify(cfg))}catch(e){}}

/* ============================== 資料 ============================== */
const BAR=300000;
async function fetchBinance(sym,start,n){
  let err;
  for(const h of['https://data-api.binance.vision','https://api.binance.com']){
    try{
      const r=await fetch(`${h}/api/v3/klines?symbol=${sym}&interval=5m&startTime=${start}&limit=${n}`);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      return j.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
    }catch(e){err=e}
  }
  try{
    const r=await fetch(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${sym}&interval=5&start=${start}&end=${start+n*BAR}&limit=${n}`);
    const j=await r.json();
    return j.result.list.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]})).sort((a,b)=>a.t-b.t);
  }catch(e){throw err||e}
}
function synth(n){
  let p=500*Math.exp(Math.random()*5),t=Date.now()-n*BAR-86400000*30,vol=0.0025,drift=0;
  const out=[];
  for(let i=0;i<n;i++){
    if(i%70===0)drift=(Math.random()-0.5)*0.0012;
    vol=Math.max(0.0008,Math.min(0.007,vol*(0.96+Math.random()*0.08)+(Math.random()<0.03?0.0015:0)));
    const o=p;let h=o,l=o,c=o;
    for(let s=0;s<10;s++){c*=1+drift/10+randn()*vol/Math.sqrt(10);h=Math.max(h,c);l=Math.min(l,c)}
    out.push({t:t+i*BAR,o,h,l,c,v:100*(1+Math.abs(c-o)/o/vol)*(0.6+Math.random())});
    p=c;
  }
  return out;
}
function parseCsv(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length)throw new Error('CSV 是空的');
  const sp=l=>l.split(/[,;\t]/).map(s=>s.trim().replace(/^"|"$/g,''));
  let head=sp(lines[0]),idx={t:0,o:1,h:2,l:3,c:4,v:5},start=0;
  if(isNaN(+head[1])){
    start=1;const low=head.map(s=>s.toLowerCase());
    const f=(...ks)=>low.findIndex(s=>ks.some(k=>s.includes(k)));
    const m={t:f('time','date','時間','open_time','timestamp'),o:f('open','開'),h:f('high','高'),l:f('low','低'),c:f('close','收'),v:f('vol','量')};
    for(const k in m)if(m[k]>=0)idx[k]=m[k];
  }
  const out=[];
  for(let i=start;i<lines.length;i++){
    const r=sp(lines[i]);let t=+r[idx.t];
    if(isNaN(t))t=Date.parse(r[idx.t]);else if(t<1e11)t*=1000;
    const o=+r[idx.o],h=+r[idx.h],l=+r[idx.l],c=+r[idx.c],v=+r[idx.v]||0;
    if([t,o,h,l,c].some(x=>!isFinite(x)))continue;
    out.push({t,o,h,l,c,v});
  }
  out.sort((a,b)=>a.t-b.t);
  return out;
}
let csvData=null;
let prefetch=null;
async function loadData(c){
  const need=c.hist+c.play;
  if(c.source==='synth')return{cs:synth(need),sym:'SYNTH',synthetic:true};
  if(c.source==='csv'){
    if(!csvData||csvData.length<need)throw new Error(`CSV 至少需要 ${need} 根 K 棒（目前 ${csvData?csvData.length:0}）`);
    const s=Math.floor(Math.random()*(csvData.length-need+1));
    return{cs:csvData.slice(s,s+need),sym:'CSV'};
  }
  for(let tries=0;tries<6;tries++){
    const sym=c.sym==='RANDOM'?SYMS[Math.floor(Math.random()*SYMS.length)]:c.sym;
    const lo=Date.UTC(2021,0,1),hi=Date.now()-need*BAR-86400000*2;
    const start=Math.floor((lo+Math.random()*(hi-lo))/BAR)*BAR;
    const cs=await fetchBinance(sym,start,need);
    if(cs.length>=need*0.98&&cs.length>=c.hist+50)return{cs,sym};
  }
  throw new Error('取得的資料不足');
}
const prefetchKey=c=>JSON.stringify([c.source,c.sym,c.hist,c.play]);

/* ============================== SMC 分析（只用過去資訊：每個事件都帶 at 索引） ============================== */
function atrArr(cs,n=14){
  const a=new Array(cs.length).fill(0);let s=0;
  for(let i=0;i<cs.length;i++){
    const tr=i?Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c)):cs[i].h-cs[i].l;
    if(i<n){s+=tr;a[i]=s/(i+1)}else a[i]=(a[i-1]*(n-1)+tr)/n;
  }
  return a;
}
function analyze(cs,L=3){
  const N=cs.length,atr=atrArr(cs);
  const piv=[],ev=[],obs=[],fvg=[],sweeps=[],eq=[];
  let lastH=null,lastL=null,trend=0,actH=[],actL=[],chIdx=-1;
  for(let k=0;k<N;k++){
    const c=cs[k],i=k-L;
    // 擺動高低點（延遲 L 根確認）
    if(i>=L){
      let isH=true,isL=true;
      for(let j=i-L;j<=i+L;j++){
        if(j===i)continue;
        if(j<i){if(cs[j].h>=cs[i].h)isH=false;if(cs[j].l<=cs[i].l)isL=false}
        else{if(cs[j].h>cs[i].h)isH=false;if(cs[j].l<cs[i].l)isL=false}
      }
      if(isH){
        const p={type:'H',i,p:cs[i].h,conf:k,eq:false,broken:false};piv.push(p);lastH=p;
        for(const o of actH)if(Math.abs(o.p-p.p)<=atr[k]*0.2){o.eq=p.eq=true;eq.push({type:'H',a:o,b:p,conf:k})}
        actH.push(p);
      }
      if(isL){
        const p={type:'L',i,p:cs[i].l,conf:k,eq:false,broken:false};piv.push(p);lastL=p;
        for(const o of actL)if(Math.abs(o.p-p.p)<=atr[k]*0.2){o.eq=p.eq=true;eq.push({type:'L',a:o,b:p,conf:k})}
        actL.push(p);
      }
    }
    // 流動性掃蕩：影線刺穿但收盤收回
    for(const o of actH.slice())if(c.h>o.p){if(c.c<o.p)sweeps.push({side:'H',i:o.i,p:o.p,at:k,eq:o.eq});actH.splice(actH.indexOf(o),1)}
    for(const o of actL.slice())if(c.l<o.p){if(c.c>o.p)sweeps.push({side:'L',i:o.i,p:o.p,at:k,eq:o.eq});actL.splice(actL.indexOf(o),1)}
    // OB / FVG 失效
    for(const o of obs)if(o.mit==null&&k>o.at){if(o.dir===1?c.c<o.lo:c.c>o.hi)o.mit=k}
    for(const f of fvg)if(f.mit==null&&k>f.at){if(f.dir===1?c.c<f.lo:c.c>f.hi)f.mit=k}
    // 結構突破（以收盤）
    if(lastH&&!lastH.broken&&c.c>lastH.p){
      const isCH=trend===-1;let valid=true,ext=null;
      if(isCH)chIdx=k;
      else if(chIdx>=0){ext=-Infinity;for(let m=chIdx;m<k;m++)ext=Math.max(ext,cs[m].h);valid=c.c>ext}
      ev.push({type:isCH?'CHoCH':'BOS',dir:1,level:lastH.p,from:lastH.i,at:k,valid,ext});
      trend=1;lastH.broken=true;
      const st=Math.max(k-60,lastL?Math.min(lastL.i,lastH.i):lastH.i);
      let j=st;for(let m=st;m<=k;m++)if(cs[m].l<cs[j].l)j=m;
      let ob=j;for(let m=j;m>=Math.max(st,j-3);m--)if(cs[m].c<cs[m].o){ob=m;break}
      obs.push({dir:1,i:ob,hi:cs[ob].h,lo:cs[ob].l,at:k,mit:null});
    }
    if(lastL&&!lastL.broken&&c.c<lastL.p){
      const isCH=trend===1;let valid=true,ext=null;
      if(isCH)chIdx=k;
      else if(chIdx>=0){ext=Infinity;for(let m=chIdx;m<k;m++)ext=Math.min(ext,cs[m].l);valid=c.c<ext}
      ev.push({type:isCH?'CHoCH':'BOS',dir:-1,level:lastL.p,from:lastL.i,at:k,valid,ext});
      trend=-1;lastL.broken=true;
      const st=Math.max(k-60,lastH?Math.min(lastH.i,lastL.i):lastL.i);
      let j=st;for(let m=st;m<=k;m++)if(cs[m].h>cs[j].h)j=m;
      let ob=j;for(let m=j;m>=Math.max(st,j-3);m--)if(cs[m].c>cs[m].o){ob=m;break}
      obs.push({dir:-1,i:ob,hi:cs[ob].h,lo:cs[ob].l,at:k,mit:null});
    }
    // FVG
    if(k>=2){
      if(cs[k].l>cs[k-2].h&&cs[k].l-cs[k-2].h>0.1*atr[k])fvg.push({dir:1,from:k-2,lo:cs[k-2].h,hi:cs[k].l,at:k,mit:null});
      else if(cs[k].h<cs[k-2].l&&cs[k-2].l-cs[k].h>0.1*atr[k])fvg.push({dir:-1,from:k-2,lo:cs[k].h,hi:cs[k-2].l,at:k,mit:null});
    }
  }
  return{piv,ev,obs,fvg,sweeps,eq,atr};
}
const active=(x,k)=>x.at<=k&&(x.mit==null||x.mit>k);
// 在時間點 k 對方向 dir 的 SMC 情境（k 之後的資訊一律不使用）
function contextAt(an,cs,k,dir){
  let trend=0,lastEv=null;
  for(let e=an.ev.length-1;e>=0;e--)if(an.ev[e].at<=k){trend=an.ev[e].dir;lastEv=an.ev[e];break}
  let H=null,Lw=null;
  for(let p=an.piv.length-1;p>=0;p--){const v=an.piv[p];if(v.conf<=k){if(!H&&v.type==='H')H=v;if(!Lw&&v.type==='L')Lw=v;if(H&&Lw)break}}
  const c=cs[k];let rng=null,pd=0,pct=null;
  if(H&&Lw){
    const hi=Math.max(H.p,Lw.p),lo=Math.min(H.p,Lw.p),eq=(hi+lo)/2;
    rng={hi,lo,eq,from:Math.min(H.i,Lw.i)};pd=c.c>eq?1:-1;pct=(c.c-lo)/((hi-lo)||1);
  }
  const a=Math.max(0,k-2);let h3=-1e18,l3=1e18;for(let m=a;m<=k;m++){h3=Math.max(h3,cs[m].h);l3=Math.min(l3,cs[m].l)}
  const obHit=an.obs.find(o=>o.dir===dir&&active(o,k)&&l3<=o.hi&&h3>=o.lo)||null;
  const fvgHit=an.fvg.find(f=>f.dir===dir&&active(f,k)&&l3<=f.hi&&h3>=f.lo)||null;
  const recent=an.ev.filter(e=>e.dir===dir&&e.at<=k&&e.at>k-30);
  const choch=recent.some(e=>e.type==='CHoCH'),bos=recent.some(e=>e.type==='BOS');
  const sweep=an.sweeps.some(s=>s.side===(dir===1?'L':'H')&&s.at<=k&&s.at>k-12);
  const trendOk=trend===dir,pdOk=pd===-dir;
  const score=(trendOk?1:0)+(pdOk?1:0)+((obHit||fvgHit)?1:0)+((choch||bos)?1:0)+(sweep?1:0);
  const tags=[];
  if(trendOk)tags.push('順勢');else if(trend===-dir)tags.push('逆勢');
  if(pdOk)tags.push(dir===1?'折價區':'溢價區');
  if(obHit)tags.push('OB');if(fvgHit)tags.push('FVG');
  if(choch)tags.push('CHoCH');if(bos)tags.push('BOS');
  if(sweep)tags.push('流動性掃蕩');
  if(!obHit&&!fvgHit&&!choch&&!bos&&!sweep&&!pdOk)tags.push('無SMC依據');
  return{trend,lastEv,rng,pd,pct,obHit,fvgHit,choch,bos,sweep,trendOk,pdOk,score,tags};
}

/* ============================== 3+1 課程 SOP ==============================
   1. 連招：同向的 CH / BOS / FVG / OB 出現 3 種以上
        - 反向 FVG 忽略；反向 CH / BOS / OB 出現就取消
        - BOS 必須收在「CH 之後的極值」之外才算完成延續
   2. 回踩：連招成立後，第一根碰到 OB1 的 K 棒是「第 1 根」，再算到第 3 根為確認視窗
   3. 確認：第 3 根收盤同時越過 OB 外緣（多：OB 上緣之上；空：下緣之下），
           且越過第 1 根實體的中點，才是標準進場（收線進場）
   4. 停損：由成立位置往下（空：往上）找兩個同向 OB，放在第 2 個 OB 的完整影線之外；停利：rr 倍風險
   每根 K 棒的狀態只用到該根收盤為止的資訊。 */
function isEngulf(cs,k,d,atr){   // 選用的額外條件：大實體並突破前一根高點（做空：低點）
  if(k<1)return false;const c=cs[k],p=cs[k-1];
  if(Math.abs(c.c-c.o)<0.5*atr[k])return false;
  return d===1?(c.c>c.o&&c.c>p.h):(c.c<c.o&&c.c<p.l);
}
function sopListKind(an,cs,k,d,kind){
  const c=cs[k];
  const l=(kind==='FVG'?an.fvg:an.obs).filter(o=>o.dir===d&&active(o,k)&&(d===1?o.lo<c.c:o.hi>c.c))
    .sort((a,b)=>d===1?b.hi-a.hi:a.lo-b.lo);
  l.kind=kind;return l;
}
// 回踩區清單：先找同向 OB；完全沒有 OB 時（若開啟）改用同向 FVG
function sopList(an,cs,k,d){
  const l=sopListKind(an,cs,k,d,'OB');
  return(l.length||!cfg.fvgZone)?l:sopListKind(an,cs,k,d,'FVG');
}
function sopObs(an,cs,k,d){const l=sopList(an,cs,k,d);return{ob1:l[0]||null,ob2:l[1]||null}}
function sopRun(an,cs,rr){
  const N=cs.length,byBar=Array.from({length:N},()=>[]);
  for(const e of an.ev)if(e.valid)byBar[e.at].push({type:e.type==='CHoCH'?'CH':'BOS',dir:e.dir});
  for(const o of an.obs)byBar[o.at].push({type:'OB',dir:o.dir});
  for(const f of an.fvg)byBar[f.at].push({type:'FVG',dir:f.dir});
  const st=new Array(N),sigs=[],cancels=[],from=Math.min(3,Math.max(1,cfg.confirmFrom||3));
  const fresh=(dir,types,k)=>({dir,types,start:k,used:false,first:-1,zone:null,kind:'OB',armedAt:-1});
  let ch=fresh(0,new Set(),0);
  for(let k=0;k<N;k++){
    const c=cs[k];
    for(const s of byBar[k]){
      if(s.dir===ch.dir){
        ch.types.add(s.type);
        if(ch.used&&(s.type==='BOS'||s.type==='CH')){ch.used=false;ch.first=-1;ch.zone=null;ch.armedAt=-1}
      }else if(s.type==='FVG'&&ch.dir!==0)continue;
      else{
        if(ch.types.size>=3&&!ch.used)cancels.push({k,dir:ch.dir,by:s.type});
        ch=fresh(s.dir,new Set([s.type]),k);
      }
    }
    const armed=ch.dir!==0&&ch.types.size>=3&&!ch.used;
    if(armed&&ch.armedAt<0)ch.armedAt=k;
    let phase=ch.dir===0?'none':ch.used?'used':armed?'armed':'building',ob1=null,ob2=null,signal=null,conf=false,touchRec=-1;
    if(armed){
      const d=ch.dir;
      let list=ch.first>=0?sopListKind(an,cs,k,d,ch.kind):sopList(an,cs,k,d);
      ob1=list[0]||null;ob2=list[1]||null;
      if(ch.first>=0&&(k-ch.first>2||(ch.zone.mit!=null&&ch.zone.mit<=k))){ch.first=-1;ch.zone=null}
      if(ch.first<0&&ob1&&(d===1?c.l<=ob1.hi:c.h>=ob1.lo)){ch.first=k;ch.zone=ob1;ch.kind=list.kind}
      touchRec=ch.first;
      if(ch.first>=0){
        phase='touched';ob1=ch.zone;
        const zi=list.indexOf(ch.zone);ob2=zi>=0?(list[zi+1]||null):null;
        if(k-ch.first>=from-1){
          const z=ch.zone,f=cs[ch.first],mid=(f.o+f.c)/2;
          conf=(d===1?(c.c>z.hi&&c.c>mid):(c.c<z.lo&&c.c<mid))&&(!cfg.engulfExtra||isEngulf(cs,k,d,an.atr));
          if(conf&&!(cfg.needOb2&&!ob2)){
            const ref=ob2||z,sl=d===1?ref.lo:ref.hi,risk=(c.c-sl)*d;
            if(risk>0){
              signal={k,dir:d,entry:c.c,sl,tp:rr>0?c.c+d*risk*rr:null,hasOb2:!!ob2,kind:ch.kind,ob1:z,ob2,armedAt:ch.armedAt,touchAt:ch.first,mid};
              sigs.push(signal);ch.used=true;ch.first=-1;ch.zone=null;phase='signal';
            }
          }
        }
      }
    }
    st[k]={dir:ch.dir,types:[...ch.types],phase,ob1,ob2,signal,touchAt:touchRec,conf,kind:ch.first>=0||signal?ch.kind:(ob1&&ob1.from!=null?'FVG':'OB')};
  }
  // 結果（只供復盤使用，會看未來）
  for(const s of sigs){
    s.res='open';s.end=N-1;
    for(let j=s.k+1;j<N;j++){
      const c=cs[j];
      const hitSl=s.dir===1?c.l<=s.sl:c.h>=s.sl,hitTp=s.tp!=null&&(s.dir===1?c.h>=s.tp:c.l<=s.tp);
      if(hitSl){s.res='loss';s.end=j;break}
      if(hitTp){s.res='win';s.end=j;break}
    }
  }
  return{st,sigs,cancels};
}
// 檢查玩家在第 k 根往 d 方向進場是否符合 SOP
function sopCheck(sop,an,cs,k,d){
  const s=sop.st[k];
  const chain=s.dir===d&&s.types.length>=3;
  const pullback=chain&&s.touchAt>=0;
  const conf=chain&&pullback&&!!s.conf;
  const exact=!!(s.signal&&s.signal.dir===d);
  const tags=[];
  if(exact)tags.push('符合SOP');
  if(chain)tags.push('連招成立');else if(s.dir===-d&&s.types.length>=3)tags.push('逆連招');else tags.push('無連招');
  if(pullback)tags.push(s.kind==='FVG'?'FVG回踩':'回踩OB');else if(chain)tags.push('追價');
  if(conf)tags.push('確認收線');
  if(conf&&!exact)tags.push('不符SOP');
  return{score:(chain?1:0)+(pullback?1:0)+(conf?1:0),exact,tags};
}

/* ============================== 圖表 ============================== */
const COL={up:'#26a69a',dn:'#ef5350',ob:'#2962ff',obTxt:'#6f93ff',grid:'#1b2430',txt:'#8493a5',bg:'#0d1117'};
let hover=null,lastGeom=null;
function drawChart(cv,o){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,Hh=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(Hh*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=COL.bg;g.fillRect(0,0,W,Hh);
  const {cs,an,cur,end,viewN,layers}=o;
  const axisW=66,plotR=W-axisW,plotT=26,plotB=Hh-20;
  const volH=(plotB-plotT)*0.13,priceB=plotB-volH-4;
  const first=end-viewN+1,slots=viewN+6,bw=plotR/slots;
  const xi=i=>(i-first+0.5)*bw;
  const i0=Math.max(0,first);
  let hi=-1e18,lo=1e18,vmax=0;
  for(let i=i0;i<=end;i++){hi=Math.max(hi,cs[i].h);lo=Math.min(lo,cs[i].l);vmax=Math.max(vmax,cs[i].v)}
  const mg=(hi-lo)*0.07||hi*0.001;hi+=mg;lo-=mg;
  const yp=p=>plotT+(hi-p)/(hi-lo)*(priceB-plotT);
  lastGeom={first,bw,plotR,plotT,priceB,hi,lo,end};
  g.font='11px system-ui,sans-serif';g.textBaseline='middle';
  // 網格與價格軸
  const step=niceStep((hi-lo)/6);
  g.lineWidth=1;
  for(let p=Math.ceil(lo/step)*step;p<hi;p+=step){
    const y=Math.round(yp(p))+.5;g.strokeStyle=COL.grid;g.beginPath();g.moveTo(0,y);g.lineTo(plotR,y);g.stroke();
    g.fillStyle=COL.txt;g.textAlign='left';g.fillText(fmtP(p),plotR+6,y);
  }
  // 時間軸

  const every=Math.max(1,Math.round(viewN/6/5)*5)||5;
  for(let i=Math.ceil(i0/every)*every;i<=end;i+=every){
    const x=xi(i);g.strokeStyle=COL.grid;g.beginPath();g.moveTo(Math.round(x)+.5,plotT);g.lineTo(Math.round(x)+.5,priceB);g.stroke();
    g.fillText(o.timeLabel(i),x,plotB+10);
  }
  g.save();g.beginPath();g.rect(0,0,plotR,Hh);g.clip();
  const ctx=cur>=0?contextAt(an,cs,cur,1):null;
  // 溢價 / 折價
  if(layers.pd&&ctx&&ctx.rng){
    const r=ctx.rng,x0=Math.max(0,xi(r.from)),y1=yp(r.hi),ym=yp(r.eq),y2=yp(r.lo);
    g.fillStyle='rgba(239,83,80,.07)';g.fillRect(x0,y1,plotR-x0,ym-y1);
    g.fillStyle='rgba(38,166,154,.07)';g.fillRect(x0,ym,plotR-x0,y2-ym);
    g.strokeStyle='rgba(180,190,205,.45)';g.setLineDash([4,4]);g.beginPath();g.moveTo(x0,ym);g.lineTo(plotR,ym);g.stroke();g.setLineDash([]);
    g.fillStyle='rgba(180,190,205,.7)';g.textAlign='right';
    g.fillText('EQ 50%',plotR-4,ym-7);g.fillStyle='rgba(239,83,80,.8)';g.fillText('Premium',plotR-4,y1+9);g.fillStyle='rgba(38,166,154,.9)';g.fillText('Discount',plotR-4,y2-9);
  }

    for(const f of list){

      g.fillStyle=f.dir===1?COL.up:COL.dn;g.textAlign='left';g.fillText('FVG',Math.max(2,x0+2),yp(f.hi)+8);

    for(const b of list){

      g.fillStyle=b.dir===1?'rgba(41,98,255,.24)':'rgba(239,83,80,.22)';g.fillRect(x0,y,plotR-x0,h);

    g.globalAlpha=i>cur?0.4:1;

      g.strokeStyle=col;g.lineWidth=e.type==='CHoCH'?1.6:1;g.setLineDash(e.type==='CHoCH'?[]:[5,4]);
      g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke();g.setLineDash([]);g.lineWidth=1;
      g.fillStyle=col;g.font='bold 11px system-ui,sans-serif';g.fillText((e.type==='CHoCH'?'CH':'BOS')+(e.dir===1?'↑':'↓')+(e.valid?'':'✗未過CH'+(e.dir===1?'高':'低')),(x0+x1)/2,y+(e.dir===1?-8:9));g.font='11px system-ui,sans-serif';
    }

    g.textAlign='center';
    for(const q of an.eq){
      if(q.conf>cur||q.b.i<first)continue;
      const y=yp((q.a.p+q.b.p)/2);g.strokeStyle='rgba(255,183,77,.7)';g.setLineDash([2,3]);
      g.beginPath();g.moveTo(xi(q.a.i),y);g.lineTo(Math.min(plotR,xi(Math.min(end,q.conf+25))),y);g.stroke();g.setLineDash([]);
      g.fillStyle='rgba(255,183,77,.9)';g.fillText(q.type==='H'?'EQH':'EQL',xi(q.b.i),y+(q.type==='H'?-8:9));
    }
    for(const s of an.sweeps){
      if(s.at>cur||s.at<first)continue;
      const y=yp(s.p);g.strokeStyle='rgba(255,183,77,.9)';g.setLineDash([3,3]);g.beginPath();g.moveTo(xi(s.i),y);g.lineTo(xi(s.at),y);g.stroke();g.setLineDash([]);
      g.fillStyle='#ffb74d';g.beginPath();g.arc(xi(s.at),y,3,0,7);g.fill();
      g.fillText('Sweep',xi(s.at),y+(s.side==='H'?-9:10));
    }
  }
  // 擺動點
  if(layers.swing){
    for(const p of an.piv){
      if(p.conf>cur||p.i<first||p.i>end)continue;
      const x=xi(p.i),y=yp(p.p);g.fillStyle='rgba(200,210,225,.7)';g.beginPath();
      if(p.type==='H'){g.moveTo(x,y-3);g.lineTo(x-3,y-9);g.lineTo(x+3,y-9)}else{g.moveTo(x,y+3);g.lineTo(x-3,y+9);g.lineTo(x+3,y+9)}
      g.fill();
    }
  }
  // 事後最佳 / 訊號（復盤用）
  if(o.best){
    for(const [key,col] of[['long','#66bb6a'],['short','#ef9a9a']]){
      const b=o.best[key];if(!b||b.b<first||b.a>end)continue;
      g.strokeStyle=col;g.setLineDash([6,4]);g.beginPath();g.moveTo(xi(b.a),yp(cs[b.a].c));g.lineTo(xi(b.b),yp(cs[b.b].c));g.stroke();g.setLineDash([]);
      g.fillStyle=col;g.textAlign='center';g.font='13px system-ui,sans-serif';
      g.fillText('★',xi(b.a),yp(cs[b.a].c)+(key==='long'?16:-16));g.fillText('★',xi(b.b),yp(cs[b.b].c)+(key==='long'?-16:16));
      g.font='11px system-ui,sans-serif';g.fillText(`最佳${key==='long'?'多':'空'} ${(b.pct*100).toFixed(2)}%`,(xi(b.a)+xi(b.b))/2,yp((cs[b.a].c+cs[b.b].c)/2)-10);
    }
  }
  if(o.signals){
    // SOP 標準訊號：風險回報框（TradingView 樣式），聚焦中的訊號較亮
    g.save();g.beginPath();g.rect(0,plotT,plotR,priceB-plotT);g.clip();
    for(const s of o.signals){
      if(s.k>cur||s.end<first||s.k>end)continue;
      const x0=xi(s.k),x1=xi(Math.min(s.end,end))+bw/2,ye=yp(s.entry);
      g.globalAlpha=o.focus&&o.focus!==s?0.4:1;
      g.fillStyle='rgba(239,83,80,.18)';g.fillRect(x0,Math.min(ye,yp(s.sl)),x1-x0,Math.abs(yp(s.sl)-ye));
      if(s.tp!=null){g.fillStyle='rgba(38,166,154,.18)';g.fillRect(x0,Math.min(ye,yp(s.tp)),x1-x0,Math.abs(yp(s.tp)-ye))}
      g.strokeStyle='#cfd8e3';g.beginPath();g.moveTo(x0,ye);g.lineTo(x1,ye);g.stroke();
      const lab=s.res==='win'?'✓ 停利':s.res==='loss'?'✗ 停損':'未結束';
      g.fillStyle=s.res==='win'?COL.up:s.res==='loss'?COL.dn:'#cfd8e3';
      g.textAlign='left';g.font='bold 11px system-ui,sans-serif';
      g.fillText(`#${s.n} ${lab}`,x0+4,s.dir===1?yp(s.sl)+10:yp(s.sl)-10);g.font='11px system-ui,sans-serif';
      g.globalAlpha=1;
    }
    // 聚焦訊號：當時的 OB1 / OB2
    const fs=o.focus;
    if(fs&&fs.k<=cur){
      for(const [ob,name] of[[fs.ob1,(fs.kind==='FVG'?'FVG':'OB1')+' 進場區'],[fs.ob2,(fs.kind==='FVG'?'第2個 FVG':'OB2')+' 防守（停損）']]){
        if(!ob)continue;
        const xa=Math.max(0,xi(ob.i!=null?ob.i:ob.from)-bw/2),xb=xi(fs.k)+bw/2,ya=yp(ob.hi),yb=yp(ob.lo);
        g.strokeStyle=fs.dir===1?'#82a7ff':'#ff8a80';g.lineWidth=2;g.setLineDash([6,3]);g.strokeRect(xa,ya,xb-xa,yb-ya);g.setLineDash([]);g.lineWidth=1;
        g.fillStyle=g.strokeStyle;g.textAlign='left';g.font='bold 11px system-ui,sans-serif';g.fillText(name,xa+3,ya-7);g.font='11px system-ui,sans-serif';
      }
    }
    g.restore();
    // 進場點：整根高亮 + 大箭頭 + 編號；聚焦訊號另外標 ① ② ③ 步驟
    const pill=(t,x,y,bg)=>{
      g.font='bold 12px system-ui,sans-serif';const w=g.measureText(t).width+12;
      g.fillStyle=bg;g.beginPath();g.roundRect?g.roundRect(x-w/2,y-10,w,20,10):g.rect(x-w/2,y-10,w,20);g.fill();
      g.fillStyle='#0d1117';g.textAlign='center';g.fillText(t,x,y+.5);g.font='11px system-ui,sans-serif';
    };
    for(const s of o.signals){
      if(s.k>cur||s.k<first||s.k>end)continue;
      const f=o.focus===s,x=xi(s.k),c=cs[s.k],d=s.dir;
      g.fillStyle=f?'rgba(255,213,79,.22)':'rgba(255,213,79,.09)';g.fillRect(x-bw/2,plotT,bw,priceB-plotT);
      const col=f?'#ffd54f':d===1?'#4dd0c4':'#ff8a80',y0=d===1?yp(c.l)+6:yp(c.h)-6;
      g.fillStyle=col;g.beginPath();
      if(d===1){g.moveTo(x,y0);g.lineTo(x-9,y0+14);g.lineTo(x-3,y0+14);g.lineTo(x-3,y0+26);g.lineTo(x+3,y0+26);g.lineTo(x+3,y0+14);g.lineTo(x+9,y0+14)}
      else{g.moveTo(x,y0);g.lineTo(x-9,y0-14);g.lineTo(x-3,y0-14);g.lineTo(x-3,y0-26);g.lineTo(x+3,y0-26);g.lineTo(x+3,y0-14);g.lineTo(x+9,y0-14)}
      g.fill();
      pill(`${f?'③ ':''}#${s.n} ${d===1?'做多':'做空'} ${fmtP(s.entry)}`,x,y0+d*40,col);
    }
    if(fs&&fs.k<=cur&&fs.touchAt>=0&&fs.mid!=null){
      const ym=yp(fs.mid);g.strokeStyle='#ffd54f';g.setLineDash([3,3]);g.beginPath();g.moveTo(xi(fs.touchAt)-bw/2,ym);g.lineTo(xi(fs.k)+bw,ym);g.stroke();g.setLineDash([]);
      g.fillStyle='#ffd54f';g.textAlign='left';g.fillText('第1根實體½',xi(fs.k)+bw+2,ym);
    }
    if(fs&&fs.k<=cur){
      const steps=[[fs.armedAt,'① 連招成立'],[fs.touchAt,'② 第1根回踩 OB1']],stack={};
      for(const [i,t] of steps){
        if(i<0||i<first||i>end||i>cur)continue;
        const n=stack[i]=(stack[i]||0)+1,c=cs[i];
        const y=fs.dir===1?yp(c.h)-22-(n-1)*24:yp(c.l)+22+(n-1)*24;
        g.strokeStyle='rgba(144,202,249,.8)';g.setLineDash([2,2]);g.beginPath();g.moveTo(xi(i),fs.dir===1?yp(c.h)-2:yp(c.l)+2);g.lineTo(xi(i),y);g.stroke();g.setLineDash([]);
        pill(t,xi(i),y,'#90caf9');
      }
    }
  }
  // 交易連線
  if(o.tradeLines){
    for(const t of o.tradeLines){
      if(t.exitIdx<first||t.entryIdx>end)continue;
      g.strokeStyle=t.pnl>0?'rgba(102,187,106,.9)':'rgba(239,83,80,.9)';g.setLineDash([3,3]);
      g.beginPath();g.moveTo(xi(t.entryIdx),yp(t.entry));g.lineTo(xi(t.exitIdx),yp(t.exit));g.stroke();g.setLineDash([]);
    }
  }
  // 成交標記
  for(const f of o.fills){
    if(f.i<first||f.i>end||f.i>cur)continue;
    const x=xi(f.i),c=cs[f.i];g.textAlign='center';
    if(f.kind==='close'){
      const y=yp(f.price);g.fillStyle='#ffd54f';g.beginPath();g.moveTo(x,y-5);g.lineTo(x+5,y);g.lineTo(x,y+5);g.lineTo(x-5,y);g.fill();
    }else if(f.dir===1){
      const y=yp(c.l)+12;g.fillStyle='#4dd0c4';g.beginPath();g.moveTo(x,y-7);g.lineTo(x-6,y+4);g.lineTo(x+6,y+4);g.fill();
    }else{
      const y=yp(c.h)-12;g.fillStyle='#ff7e7a';g.beginPath();g.moveTo(x,y+7);g.lineTo(x-6,y-4);g.lineTo(x+6,y-4);g.fill();
    }
  }
  // 部位線
  if(o.pos){
    const p=o.pos;g.textAlign='left';
    const line=(price,col,dash,label)=>{
      if(price==null)return;let y=yp(price);y=Math.max(plotT,Math.min(priceB,y));
      g.strokeStyle=col;g.setLineDash(dash);g.beginPath();g.moveTo(0,y);g.lineTo(plotR,y);g.stroke();g.setLineDash([]);
      g.fillStyle=col;g.fillText(label,4,y-7);
    };
    line(p.avg,'#42a5f5',[],`${p.dir===1?'多':'空'} ${p.units}u 均價`);
    line(p.sl,'#ef5350',[6,4],'SL');line(p.tp,'#26a69a',[6,4],'TP');
  }
  // 現價線
  if(cur<=end){
    const c=cs[cur],y=yp(c.c);g.strokeStyle=c.c>=c.o?COL.up:COL.dn;g.globalAlpha=.6;g.setLineDash([2,3]);
    g.beginPath();g.moveTo(0,y);g.lineTo(plotR,y);g.stroke();g.setLineDash([]);g.globalAlpha=1;
  }
  g.restore();
  if(cur<=end){
    const c=cs[cur],y=yp(c.c);g.fillStyle=c.c>=c.o?COL.up:COL.dn;g.fillRect(plotR,y-9,axisW,18);
    g.fillStyle='#fff';g.textAlign='left';g.fillText(fmtP(c.c),plotR+5,y);
  }
  // 十字線
  let hi_i=null;
  if(hover&&hover.x<plotR&&hover.y>=plotT&&hover.y<=priceB){
    hi_i=Math.round(hover.x/bw+first-0.5);
    g.strokeStyle='rgba(180,190,205,.4)';g.setLineDash([3,3]);
    g.beginPath();g.moveTo(hover.x,plotT);g.lineTo(hover.x,priceB);g.moveTo(0,hover.y);g.lineTo(plotR,hover.y);g.stroke();g.setLineDash([]);
    const pr=hi-(hover.y-plotT)/(priceB-plotT)*(hi-lo);
    g.fillStyle='#2a3647';g.fillRect(plotR,hover.y-9,axisW,18);g.fillStyle='#fff';g.textAlign='left';g.fillText(fmtP(pr),plotR+5,hover.y);
  }
  const lab=$('#ohlc');
  const hc=(hi_i!=null&&hi_i>=0&&hi_i<=end)?cs[hi_i]:cs[Math.min(cur,end)];
  const hidx=(hi_i!=null&&hi_i>=0&&hi_i<=end)?hi_i:Math.min(cur,end);
  lab.innerHTML=`<span>${o.timeLabel(hidx,true)}</span>　O ${fmtP(hc.o)}　H ${fmtP(hc.h)}　L ${fmtP(hc.l)}　C <span class="${hc.c>=hc.o?'up':'dn'}">${fmtP(hc.c)}</span>`;
}
function niceStep(raw){const e=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/e;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*e}

/* ============================== 遊戲狀態 ============================== */
let S=null;
const INIT_EQ=10000;
function startSession(data){
  const cs=data.cs;
  const an=analyze(cs);
  S={cs,an,sop:sopRun(an,cs,cfg.rr),sym:data.sym,synthetic:!!data.synthetic,hist:cfg.hist,cur:cfg.hist-1,N:cs.length,
     over:false,pos:null,trades:[],fills:[],realized:0,eqCurve:[0],log:[],sid:Date.now(),
     rv:{cur:0,focus:null,future:$('#rvFuture').checked,sig:$('#rvSig').checked,best:$('#rvBest').checked},best:null};
  $('#setup').hidden=true;$('#game').hidden=false;$('#playPanel').hidden=false;$('#sumPanel').hidden=true;$('#reviewbar').hidden=true;
  $('#warn').innerHTML=S.synthetic?'<div class="warn">目前使用的是模擬（亂數）資料，僅供測試，不是真實歷史走勢。</div>':'';
  log('開始訓練。目前只看得到已發生的 K 棒。');
  renderAll();
  if(cfg.source==='binance'){const k=prefetchKey(cfg);prefetch={k,p:loadData(cfg).catch(()=>null)}}
}
function log(m){S.log.unshift(m);if(S.log.length>40)S.log.pop()}
function floatPnl(){const p=S.pos;if(!p)return 0;return(S.cs[S.cur].c-p.avg)*p.dir*p.qty-p.fees-S.cs[S.cur].c*p.qty*cfg.fee/100}
function openPos(price,d){
  const c=S.cs[S.cur],qty=cfg.unit/price,fee=cfg.unit*cfg.fee/100;
  let sl=null,tp=null,slNote='';
  const atrSl=()=>{sl=price-d*cfg.slK*S.an.atr[S.cur]};
  if(cfg.mode==='sop'){
    const {ob1,ob2}=sopObs(S.an,S.cs,S.cur,d),ref=ob2||ob1;
    if(ref&&((d===1?ref.lo:ref.hi)-price)*d<0){sl=d===1?ref.lo:ref.hi;slNote=ob2?'OB2 外側':'OB1 外側（沒有 OB2）'}
    else{atrSl();slNote='找不到同向 OB，改用 ATR'}
  }else if(cfg.slMode==='atr'){atrSl();slNote='ATR'}
  if(sl!=null&&cfg.rr>0)tp=price+(price-sl)*cfg.rr;
  const ctx=sopCheck(S.sop,S.an,S.cs,S.cur,d);
  if(cfg.mode==='sop'&&!slNote.startsWith('OB2'))ctx.tags.push(slNote.startsWith('OB1')?'停損用OB1':'停損用ATR');
  S.pos={dir:d,qty,cost:price*qty,avg:price,units:1,sl,tp,entryIdx:S.cur,fees:fee,risk:sl!=null?qty*Math.abs(price-sl):0,mfe:0,mae:0,ctx};
  S.fills.push({i:S.cur,dir:d,kind:'open',price});
  log(`${d===1?'買進開多':'賣出開空'} @ ${fmtP(price)}　SOP ${ctx.score}/3 [${ctx.tags.join('、')}]${slNote?`　停損 ${fmtP(sl)}（${slNote}）`:''}`);
}
function addUnit(price,d){
  const p=S.pos,qty=cfg.unit/price;
  p.cost+=price*qty;p.qty+=qty;p.avg=p.cost/p.qty;p.units++;p.fees+=cfg.unit*cfg.fee/100;
  if(p.sl!=null)p.risk+=qty*Math.max(0,(price-p.sl)*d);
  S.fills.push({i:S.cur,dir:d,kind:'add',price});
  log(`加碼 ${p.units} 單位 @ ${fmtP(price)}，均價 ${fmtP(p.avg)}`);
}
function closePos(price,idx,reason){
  const p=S.pos;
  const exitFee=price*p.qty*cfg.fee/100,gross=(price-p.avg)*p.dir*p.qty,pnl=gross-p.fees-exitFee;
  S.realized+=pnl;
  const tr={sid:S.sid,sym:S.sym,dir:p.dir,units:p.units,entryIdx:p.entryIdx,exitIdx:idx,entry:p.avg,exit:price,
    pnl,pct:pnl/(p.avg*p.qty)*100,R:p.risk>0?pnl/p.risk:null,bars:idx-p.entryIdx,reason,score:p.ctx.score,sop:p.ctx.exact,tags:p.ctx.tags,mode:cfg.mode,mfe:p.mfe*100,mae:p.mae*100,at:Date.now()};
  S.trades.push(tr);S.fills.push({i:idx,dir:p.dir,kind:'close',price});
  const db=DB.load();db.trades.push(tr);DB.save(db);
  log(`平倉(${{manual:'手動',sl:'停損',tp:'停利',end:'結束'}[reason]}) @ ${fmtP(price)}　${fmtM(pnl)} USDT${tr.R!=null?`　${fmtM(tr.R)}R`:''}`);
  S.pos=null;
}
function act(a){
  if(!S||S.over||S.cur>=S.N-1)return;
  const price=S.cs[S.cur].c;
  if(a!=='wait'){
    const d=a==='buy'?1:-1;
    if(S.pos&&S.pos.dir!==d)closePos(price,S.cur,'manual');
    else if(S.pos){if(S.pos.units>=cfg.maxU){toast(`已達最大持有 ${cfg.maxU} 單位`);return}addUnit(price,d)}
    else openPos(price,d);
  }
  advance();
}
function advance(){
  S.cur++;const k=S.cur,c=S.cs[k];
  if(S.pos){
    const p=S.pos;let hit=null;
    if(p.dir===1){if(p.sl!=null&&c.l<=p.sl)hit=['sl',Math.min(c.o,p.sl)];else if(p.tp!=null&&c.h>=p.tp)hit=['tp',Math.max(c.o,p.tp)]}
    else{if(p.sl!=null&&c.h>=p.sl)hit=['sl',Math.max(c.o,p.sl)];else if(p.tp!=null&&c.l<=p.tp)hit=['tp',Math.min(c.o,p.tp)]}
    const fav=p.dir===1?c.h-p.avg:p.avg-c.l,adv=p.dir===1?p.avg-c.l:c.h-p.avg;
    p.mfe=Math.max(p.mfe,fav/p.avg);p.mae=Math.max(p.mae,adv/p.avg);
    if(hit)closePos(hit[1],k,hit[0]);
  }
  S.eqCurve.push(S.realized+floatPnl());
  if(k>=S.N-1)endSession();else renderAll();
}
function endSession(){
  if(!S||S.over)return;
  if(S.pos)closePos(S.cs[S.cur].c,S.cur,'end');
  S.over=true;
  // 事後最佳多空段（用收盤價，且僅限訓練區間）
  const cs=S.cs,a0=S.hist-1;let best={long:null,short:null},mn=a0,mx=a0;
  for(let j=a0;j<S.N;j++){
    if(cs[j].c<cs[mn].c)mn=j;if(cs[j].c>cs[mx].c)mx=j;
    const gl=(cs[j].c-cs[mn].c)/cs[mn].c,gs=(cs[mx].c-cs[j].c)/cs[mx].c;
    if(!best.long||gl>best.long.pct)best.long={a:mn,b:j,pct:gl};
    if(!best.short||gs>best.short.pct)best.short={a:mx,b:j,pct:gs};
  }
  S.best=best;
  let peak=0,dd=0;for(const v of S.eqCurve){peak=Math.max(peak,v);dd=Math.max(dd,peak-v)}
  const db=DB.load();
  db.sessions.push({sid:S.sid,sym:S.sym,t0:cs[0].t,pnl:S.realized,n:S.trades.length,dd,at:Date.now()});DB.save(db);
  S.rv.cur=S.N-1;
  S.sigAll=S.sop.sigs.filter(s=>s.k>=S.hist-1);
  S.sigAll.forEach(s=>{s.took=S.trades.some(t=>t.dir===s.dir&&Math.abs(t.entryIdx-s.k)<=1)});
  applySigFilter();
  $('#playPanel').hidden=true;$('#sumPanel').hidden=false;$('#reviewbar').hidden=false;
  const sl=$('#rvSlider');sl.min=S.hist-1;sl.max=S.N-1;sl.value=S.N-1;
  renderSummary();renderAll();
  if(S.sigList.length)sigFocus(0);
}

/* ============================== 繪製 / UI ============================== */
function chartOpts(){
  const blind=cfg.blind&&!S.over;
  const timeLabel=(i,full)=>blind?`${i-(S.hist-1)>=0?'+':''}${i-(S.hist-1)}`+(full?' 根':''):(full?fmtT(S.cs[i].t):(()=>{const d=new Date(S.cs[i].t);return d.getHours()===0&&d.getMinutes()<30?`${d.getMonth()+1}/${d.getDate()}`:`${pad2(d.getHours())}:${pad2(d.getMinutes())}`})());
  const st=S.sop.st[S.over?S.rv.cur:S.cur];
  const sopObs=cfg.hint&&st.phase!=='none'&&st.phase!=='building'&&st.phase!=='used'?{ob1:st.ob1,ob2:st.ob2}:null;
  if(!S.over)return{cs:S.cs,an:S.an,cur:S.cur,end:S.cur,viewN:cfg.view,layers:cfg.layers,pos:S.pos,fills:S.fills,timeLabel,sopObs};
  const rv=S.rv,end=rv.future?Math.min(S.N-1,rv.cur+Math.round(cfg.view*0.4)):rv.cur;
  return{cs:S.cs,an:S.an,cur:rv.cur,end,viewN:cfg.view,layers:cfg.layers,pos:null,fills:S.fills,timeLabel,sopObs,
    best:rv.best?S.best:null,signals:rv.sig?S.sigList:null,focus:rv.sig?S.sigList[rv.focus]:null,tradeLines:S.trades};
}
function redraw(){if(S)drawChart($('#cv'),chartOpts())}
function renderAll(){renderTop();renderPos();renderHint();renderLog();renderButtons();redraw()}
function renderTop(){
  const unreal=floatPnl(),tot=S.realized+unreal,bal=INIT_EQ+tot;
  const blind=cfg.blind&&!S.over;
  $('#topinfo').innerHTML=
    `<span>${blind?'標的：<b>???</b>':`標的：<b>${S.sym}</b>`}</span>`+
    `<span>進度 <b>${S.cur-S.hist+1}</b> / ${S.N-S.hist+1}</span>`+
    `<span>權益 <b>${bal.toFixed(2)}</b> <span class="${cls(tot)}">(${fmtM(tot)})</span></span>`+
    `<span>已平倉 <b>${S.trades.length}</b> 筆　勝 <b>${S.trades.filter(t=>t.pnl>0).length}</b></span>`+
    (S.over?`<span class="mut">${fmtT(S.cs[0].t)} ～ ${fmtT(S.cs[S.N-1].t)}</span>`:'');
}
function renderPos(){
  const p=S.pos,c=S.cs[S.cur];
  if(!p){$('#posBox').innerHTML='<span>狀態</span><span>空手</span><span>已實現</span><span class="'+cls(S.realized)+'">'+fmtM(S.realized)+'</span>';return}
  const fp=floatPnl(),pct=fp/(p.avg*p.qty)*100;
  $('#posBox').innerHTML=`<span>方向</span><span class="${p.dir===1?'up':'dn'}">${p.dir===1?'多單':'空單'} × ${p.units}</span>`+

const PHASE={none:'尚無訊號',building:'收集條件中（未滿 3 個）',armed:'連招成立，等待回踩 OB1',touched:'已碰到 OB1，等待確認收線',
  signal:'進場訊號：確認收線成立',used:'本輪訊號已出現，等下一個同向結構突破'};
function renderHint(){

const GOOD=/符合SOP|連招成立|回踩OB|FVG回踩|確認收線/,BAD=/追價|無連招|逆連招|停損用|不符SOP/;
function tagHtml(tags){return tags.map(t=>`<span class="tag ${GOOD.test(t)?'g':BAD.test(t)?'r':''}">${t}</span>`).join('')}

function agg(ts){
  const n=ts.length;if(!n)return null;
  const w=ts.filter(t=>t.pnl>0),l=ts.filter(t=>t.pnl<=0),gp=sum(w.map(t=>t.pnl)),gl=-sum(l.map(t=>t.pnl));
  const rs=ts.filter(t=>t.R!=null);let eq=0,pk=0,dd=0;
  for(const t of ts){eq+=t.pnl;pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq)}
  return{n,wins:w.length,wr:w.length/n,pnl:sum(ts.map(t=>t.pnl)),avgW:w.length?gp/w.length:0,avgL:l.length?-gl/l.length:0,
    pf:gl>0?gp/gl:(gp>0?Infinity:0),avgR:rs.length?mean(rs.map(t=>t.R)):null,exp:sum(ts.map(t=>t.pnl))/n,dd,hold:mean(ts.map(t=>t.bars)),score:mean(ts.map(t=>t.score))};
}
const stat=(l,v,c='')=>`<div class="stat"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`;
const fmtPF=v=>v===Infinity?'∞':v.toFixed(2);

    stat('符合 SOP 的交易',a?`${S.trades.filter(t=>t.sop).length} / ${a.n}`:'-')+stat('事後最佳多/空',`${(b.long.pct*100).toFixed(1)}% / ${(b.short.pct*100).toFixed(1)}%`)+`</div>`+

      `<td class="${s.res==='win'?'up':s.res==='loss'?'dn':''}">${s.res==='win'?'停利':s.res==='loss'?'停損':'未結束'}</td><td class="${s.took?'up':'dn'}">${s.took?'✓ 跟上':'✗ 錯過'}</td></tr>`).join('')||'<tr><td>本局沒有符合條件的進場點</td></tr>';
  $('#sumTable').innerHTML=`<tr><th>#</th><th>向</th><th>單位</th><th>損益</th><th>R</th><th>SOP</th><th>出場</th></tr>`+
    S.trades.map((t,i)=>`<tr class="click" data-i="${i}"><td>${i+1}</td><td class="${t.dir===1?'up':'dn'}">${t.dir===1?'多':'空'}</td><td>${t.units}</td>`+
      `<td class="${cls(t.pnl)}">${fmtM(t.pnl)}</td><td>${t.R!=null?fmtM(t.R):'-'}</td><td>${t.score}/3</td><td>${{manual:'手動',sl:'停損',tp:'停利',end:'結束'}[t.reason]}</td></tr>`+
      `<tr><td colspan="7" style="text-align:left;padding-bottom:6px"><div class="tags">${tagHtml(t.tags)}</div></td></tr>`).join('')||'<tr><td>本局沒有交易</td></tr>';
}
// 本局若完全照 SOP 執行的結果
function sopSummary(){
  const sg=S.sop.sigs.filter(s=>s.k>=S.hist-1),w=sg.filter(s=>s.res==='win').length,l=sg.filter(s=>s.res==='loss').length;
  const took=sg.filter(s=>S.trades.some(t=>t.dir===s.dir&&Math.abs(t.entryIdx-s.k)<=1)).length;
  const missed=sg.length-took;
  return `<div class="mut" style="margin-top:10px;font-size:12.5px;line-height:1.7">本局 SOP 標準訊號 <b style="color:var(--txt)">${sg.length}</b> 個：`+
    `停利 <span class="up">${w}</span>、停損 <span class="dn">${l}</span>${sg.length-w-l?`、未結束 ${sg.length-w-l}`:''}`+
    `${w+l?`（照做勝率 ${(w/(w+l)*100).toFixed(0)}%，${cfg.rr}R 淨 ${fmtM(w*cfg.rr-l,1)}R）`:''}。你跟上 ${took} 個，錯過 ${missed} 個。`+
    `${S.sop.cancels.filter(c=>c.k>=S.hist-1).length?` 反向訊號取消的連招 ${S.sop.cancels.filter(c=>c.k>=S.hist-1).length} 次。`:''}</div>`;
}

function sigFocus(i){

  cv.addEventListener('mouseleave',()=>{hover=null;drag=null;redraw()});
  let drag=null;
  cv.addEventListener('mousedown',e=>{if(S&&S.over){const r=cv.getBoundingClientRect();drag={x:e.clientX-r.left,cur:S.rv.cur}}});
  window.addEventListener('mouseup',()=>drag=null);
  cv.addEventListener('wheel',e=>{e.preventDefault();cfg.view=Math.max(30,Math.min(300,Math.round(cfg.view*(e.deltaY>0?1.12:0.89))));saveCfg();redraw()},{passive:false});
  $$('[data-zoom]').forEach(b=>b.onclick=()=>{cfg.view=Math.max(30,Math.min(300,Math.round(cfg.view*+b.dataset.zoom)));saveCfg();redraw()});
  new ResizeObserver(()=>redraw()).observe(cv.parentElement);
  window.addEventListener('keydown',e=>{
    if(!S||S.over||$('#game').hidden||$('#tab-play').hidden)return;
    if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='checkbox')return;
    const k=e.key.toLowerCase();
    if(k==='b'||k==='arrowup'){e.preventDefault();act('buy')}
    else if(k==='s'||k==='arrowdown'){e.preventDefault();act('sell')}
    else if(k==='w'||k===' '||k==='arrowright'){e.preventDefault();act('wait')}
  });
  window.addEventListener('keydown',e=>{if(S&&S.over&&!$('#tab-play').hidden&&document.activeElement.tagName!=='INPUT'&&/^[np]$/i.test(e.key)){sigFocus((S.rv.focus??-1)+(e.key.toLowerCase()==='n'?1:-1));return}
    if(S&&S.over&&!$('#tab-play').hidden&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&document.activeElement.tagName!=='INPUT'){e.preventDefault();rvGo(S.rv.cur+(e.key==='ArrowRight'?1:-1))}});
  // 供自動測試
  window.__dbg={get S(){return S}};
});
</script>
</body>
</html>
